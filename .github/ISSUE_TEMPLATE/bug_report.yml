name: Bug report
description: Something in an implementation behaves wrongly
labels: ["bug"]
body:
  - type: input
    id: where
    attributes: {label: System and language, placeholder: billing_subscriptions / go}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected vs actual behaviour}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
