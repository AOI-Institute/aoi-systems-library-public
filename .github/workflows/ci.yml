# Runs every system's tests for each language (tools/run_suites.py).
# The run fails only on a REGRESSION: a suite that is not listed in ci/baseline.json and does not pass.
# Known-failing suites are listed there so main is not permanently red; fix one, then delete its line.
# [2026-10-01 06:50 UTC] Actions moved to their Node 24 majors (GitHub retires Node 20 for actions), setup-go's own
# cache turned off (no go.sum here; .deps is cached below), and the runner pinned to ubuntu-24.04 so the
# 2026-10-19 move of ubuntu-latest to Ubuntu 26 cannot turn main red on its own: bump it on purpose.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: [csharp, go, java, javascript, php, python, rust, typescript]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v6
        if: matrix.lang == 'javascript' || matrix.lang == 'typescript'
        with: {node-version: "22"}
      - uses: actions/setup-go@v6
        if: matrix.lang == 'go'
        with: {go-version: stable, cache: false}
      - uses: actions/setup-java@v5
        if: matrix.lang == 'java'
        with: {distribution: temurin, java-version: "21"}
      - uses: shivammathur/setup-php@v2
        if: matrix.lang == 'php'
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring
          tools: composer
      - uses: actions/setup-dotnet@v5
        if: matrix.lang == 'csharp'
        with: {dotnet-version: "8.0.x"}
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'

      # Third-party packages are downloaded into .deps/ and cached per language.
      - uses: actions/cache@v5
        with:
          path: .deps
          key: deps-${{ matrix.lang }}-${{ hashFiles('tools/run_suites.py') }}

      - name: Run suites
        run: >
          python tools/run_suites.py --lang ${{ matrix.lang }}
          --baseline ci/baseline.json
          --json results-${{ matrix.lang }}.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload per-suite results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ matrix.lang }}
          path: results-${{ matrix.lang }}.json
          if-no-files-found: ignore
